# Scrapes the Flask store running on the host: GET /metrics (demo_site/ext/metrics9.py). docker-compose.yml fills in
# __STORE_PORT__ (default 5000) when it starts Prometheus, and maps host.docker.internal to the host.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: lab-store
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:__STORE_PORT__"]
