# W3 Ch4 lab. Redis is optional (REDIS_URL=memory:// works without it); the
# `monitoring` profile is optional too and exists only because the W3 capstone
# asks for a Grafana signal-health dashboard. Everything binds to 127.0.0.1.
#
#   docker compose up -d --wait                     # just Redis
#   docker compose --profile monitoring up -d       # + Prometheus + Grafana
#
# The Flask app runs on the host (python demo_site/app.py), not in a container,
# so Prometheus scrapes it via host.docker.internal.
name: w3-ch04-detection-ops

services:
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
