# Scrapes the Flask store running on the host. The store exposes defenses/metrics.py at /metrics
# (demo_site/ext/ops.py). docker-compose.yml substitutes __STORE_PORT__ (default 5000) when it starts
# Prometheus, and maps host.docker.internal to the host.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: bot_defense
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:__STORE_PORT__"]
