# Optional: a real Redis 8 for the lab. You do NOT need this — the default
# store is memory:// (fakeredis), which runs the same code in-process.
#
# Redis 8 is required here because this chapter uses the probabilistic data
# structures (CMS.*, TOPK.*) that Redis 8 ships in core. It is AGPLv3.
# Bound to loopback only.
name: w3-ch03-streaming
services:
  redis:
    image: redis:8.10.2-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
