# Chapter 2 lab: Redis for single-use nonces and clearance budgets.
#
#   docker compose up -d --wait     # start
#   docker compose down -v          # stop and wipe
#
# The Flask app runs on the host (python demo_site/app.py) and connects with
# REDIS_URL=redis://127.0.0.1:6379/0 (the default). Without Docker the app
# falls back to an in-process fakeredis.

name: w2-ch02-js-challenges

services:
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
