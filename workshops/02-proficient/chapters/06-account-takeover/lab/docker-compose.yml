# OPTIONAL. The lab runs with no Docker at all: an in-process fakeredis and a
# local SQLite file are the defaults. Use this only if you want the
# production-shaped stack — real Redis + PostgreSQL — which is what you would run
# in anger. Both services bind to 127.0.0.1 so nothing is exposed off the host.
#
#   docker compose up -d
#   export REDIS_URL=redis://127.0.0.1:6379/0
#   export DATABASE_URL=postgresql+psycopg://workshop:workshop@127.0.0.1:5432/shop
#   python tools/seed.py && DEFENSE_LEVEL=0 python demo_site/app.py
#   docker compose down -v      # stop and wipe
name: w2-ch06-ato

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
