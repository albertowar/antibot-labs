# Chapter 3 lab: Redis for drop sessions, traces and replay signatures.
#
#   docker compose up -d --wait      # start
#   docker compose down -v           # stop and forget every signature
#
# The Flask app runs on the host (python demo_site/app.py) and connects with
# REDIS_URL=redis://localhost:6379/0. No Docker? Run the app with STORE=memory.

name: w2-ch03-behavior

services:
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
