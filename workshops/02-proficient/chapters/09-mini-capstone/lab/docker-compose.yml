# Chapter 9 capstone: Redis + PostgreSQL for the demo store.
#
#   docker compose up -d --wait     # start both, bound to 127.0.0.1 only
#   docker compose down -v          # stop and wipe all lab data
#
# The Flask store and the TLS edge run on the host (python demo_site/app.py).
# Only these two stateful services are containerised.

name: w2-ch09-capstone

services:
  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
