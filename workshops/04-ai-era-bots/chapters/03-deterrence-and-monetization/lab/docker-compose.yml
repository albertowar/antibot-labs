# Optional production-shaped backend for the W4 Ch3 lab.
# The lab runs fully WITHOUT this (fakeredis + SQLite by default). Use it only to
# rehearse on Redis + PostgreSQL. Both are bound to 127.0.0.1 — never exposed.
#
#   docker compose up -d
#   export REDIS_URL=redis://127.0.0.1:6379/0
#   export DATABASE_URL=postgresql+psycopg://workshop:workshop@127.0.0.1:5432/shop
#   python tools/seed.py && python demo_site/app.py
name: w4-ch03-deterrence
services:
  redis:
    image: redis:8.10.2-alpine
    ports: ["127.0.0.1:6379:6379"]
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: shop
    ports: ["127.0.0.1:5432:5432"]
