# Optional. The lab runs without Docker (fakeredis + SQLite). Bring these up to run the
# store on the production-shaped stack the series uses everywhere else:
#   docker compose up -d --wait
#   REDIS_URL=redis://127.0.0.1:6379/0 DATABASE_URL=postgresql+psycopg://workshop:workshop@127.0.0.1:5432/shop \
#     python tools/seed.py && DEFENSE_LEVEL=0 PORT=8409 python demo_site/app.py   (pip install "psycopg[binary]==3.3.6")
name: w4-ch09-capstone
services:
  redis:
    image: redis:8.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 15}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: workshop, POSTGRES_PASSWORD: workshop, POSTGRES_DB: shop}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U workshop -d shop"], interval: 2s, timeout: 2s, retries: 15}
volumes:
  pgdata: {}
