# W1 Ch9 lab: Redis and PostgreSQL for the drop store.
#
#   docker compose up -d --wait     # start
#   docker compose down -v          # stop and wipe everything
#
# The Flask store runs on the host (python demo_site/app.py) and connects with
#   REDIS_URL=redis://localhost:6379/0
#   DATABASE_URL=postgresql+psycopg://workshop:workshop@localhost:5432/shop
# Both ports are bound to 127.0.0.1 only.
#
# Redis 8 is used because it is the first line available under an OSI
# licence again (AGPLv3, alongside RSALv2/SSPLv1); 7.4 is RSAL/SSPL only.

name: w1-ch09-capstone

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d shop"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
