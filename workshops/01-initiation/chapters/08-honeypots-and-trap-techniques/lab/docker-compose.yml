# Chapter 8 lab: Redis for trap events, sanctions, accounts and reviews.
#
#   docker compose up -d --wait   # start
#   docker compose down -v        # stop and wipe everything
#
# The Flask app runs on the host (python demo_site/app.py) and connects with
# REDIS_URL=redis://localhost:6379/0 (the default). No Docker? Start the app
# with REDIS_URL=memory:// instead and it uses an in-process fakeredis.
#
# Redis 8 is licensed AGPLv3 (among other options). Valkey (BSD) is a drop-in
# replacement: swap the image for valkey/valkey and nothing else changes.

name: w1-ch08-honeypots

services:
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
