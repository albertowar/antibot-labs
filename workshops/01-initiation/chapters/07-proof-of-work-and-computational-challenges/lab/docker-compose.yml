# Chapter 7 lab: Redis for spent nonces, pass budgets and rate windows.
#
#   docker compose up -d --wait   # start
#   docker compose down           # stop (nothing worth keeping is stored)
#
# The Flask app runs on the host (cd demo_site && python app.py) and
# connects with REDIS_URL=redis://localhost:6379/0. No Docker? STORE=memory.

name: w1-ch07-pow

services:
  redis:
    image: redis:8.10.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
